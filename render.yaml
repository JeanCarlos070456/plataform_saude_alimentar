services:
  - type: web
    name: caafe-inseguranca-dashboard
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: caafe-data
      - key: SUPABASE_OBJECT_PATH
        value: analytics/caafe_dashboard.csv
      - key: CAAFE_REFRESH_SECONDS
        value: "3600"
      - key: CAAFE_MODEL_MODE
        value: validated
      - key: DATA_REFRESH_TOKEN
        generateValue: true
