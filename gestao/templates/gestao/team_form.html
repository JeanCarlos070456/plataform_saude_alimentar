{% extends 'gestao/base.html' %}
{% block title %}{{ title }} | Gestão{% endblock %}
{% block content %}
<div class="page-heading"><div><span class="eyebrow">EQUIPE</span><h1>{{ title }}</h1><p>Foto, nome, função, apresentação e Currículo Lattes.</p></div></div>
<section class="panel form-panel"><form method="post" enctype="multipart/form-data" class="form-grid" novalidate>{% csrf_token %}
{% for field in form %}<label class="{% if field.name == 'short_bio' %}full-width{% endif %}">{{ field.label }}{{ field }}{{ field.errors }}</label>{% endfor %}
<div class="form-actions full-width"><a class="secondary-button button-link" href="{% url 'gestao:team_list' %}">Cancelar</a><button class="primary-button" type="submit">Salvar membro</button></div></form></section>
{% endblock %}
